<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مساعد الفقيه</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0e1a">
    <link rel="icon" type="image/png" href="icon-512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Animated gradient background */
        .bg-gradient-animate {
            background: linear-gradient(135deg, #0a0e1a 0%, #0d1525 25%, #0f1a2e 50%, #0a1628 75%, #0a0e1a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #C5A059;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #004D40;
            bottom: -80px;
            left: -80px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: #1a6b5a;
            top: 50%;
            left: 50%;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Glass card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 1px 0 rgba(255, 255, 255, 0.1) inset;
        }

        /* Input styling */
        .input-field {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #C5A059;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15), 0 0 20px rgba(197, 160, 89, 0.1);
            outline: none;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Login button */
        .btn-login {
            background: linear-gradient(135deg, #C5A059, #d4b06a, #C5A059);
            background-size: 200% 200%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.3);
            background-position: right center;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Logo pulse */
        .logo-ring {
            animation: ringPulse 3s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(197, 160, 89, 0); }
        }

        /* Error shake */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        /* Fade in up */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-delay-1 { animation-delay: 0.1s; opacity: 0; }
        .animate-delay-2 { animation-delay: 0.2s; opacity: 0; }
        .animate-delay-3 { animation-delay: 0.3s; opacity: 0; }
        .animate-delay-4 { animation-delay: 0.4s; opacity: 0; }
        .animate-delay-5 { animation-delay: 0.5s; opacity: 0; }

        /* Geometric pattern */
        .geo-pattern {
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(197, 160, 89, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(0, 77, 64, 0.03) 0%, transparent 50%);
        }

        /* Password toggle */
        .password-toggle {
            transition: all 0.2s ease;
        }

        .password-toggle:hover {
            color: #C5A059;
        }

        /* Loading spinner */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #0a0e1a;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success animation */
        @keyframes successPulse {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-icon {
            animation: successPulse 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body>
    <div id="admin-root"></div>

    <script type="module">
        import React, { useState, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';

        // SVG Icons as components
        const LockIcon = () => React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
            React.createElement('rect', { width: 18, height: 11, x: 3, y: 11, rx: 2, ry: 2 }),
            React.createElement('path', { d: 'M7 11V7a5 5 0 0 1 10 0v4' })
        );

        const UserIcon = () => React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
            React.createElement('path', { d: 'M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2' }),
            React.createElement('circle', { cx: 12, cy: 7, r: 4 })
        );

        const KeyIcon = () => React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
            React.createElement('circle', { cx: 7.5, cy: 15.5, r: 5.5 }),
            React.createElement('path', { d: 'M11.5 11.5 22 1' }),
            React.createElement('path', { d: 'M18 5l4 0 0-4' })
        );

        const EyeIcon = () => React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
            React.createElement('path', { d: 'M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0' }),
            React.createElement('circle', { cx: 12, cy: 12, r: 3 })
        );

        const EyeOffIcon = () => React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
            React.createElement('path', { d: 'M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49' }),
            React.createElement('path', { d: 'M14.084 14.158a3 3 0 0 1-4.242-4.242' }),
            React.createElement('path', { d: 'M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143' }),
            React.createElement('path', { d: 'M2 2l20 20' })
        );

        const CheckIcon = () => React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', width: 40, height: 40, viewBox: '0 0 24 24', fill: 'none', stroke: '#22c55e', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
            React.createElement('path', { d: 'M22 11.08V12a10 10 0 1 1-5.93-9.14' }),
            React.createElement('path', { d: 'M22 4 12 14.01l-3-3' })
        );

        const AlertIcon = () => React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' },
            React.createElement('circle', { cx: 12, cy: 12, r: 10 }),
            React.createElement('line', { x1: 12, x2: 12, y1: 8, y2: 12 }),
            React.createElement('line', { x1: 12, x2: 12.01, y1: 16, y2: 16 })
        );

        const ShieldIcon = () => React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round' },
            React.createElement('path', { d: 'M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z' }),
            React.createElement('path', { d: 'M9 12l2 2 4-4' })
        );

        // Admin credentials
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = '510000';

        const AdminLogin = () => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);
            const [shakeForm, setShakeForm] = useState(false);
            const usernameRef = useRef(null);

            useEffect(() => {
                // Check if already logged in
                const token = sessionStorage.getItem('admin_auth');
                if (token === 'authenticated') {
                    window.location.href = '/admin-dashboard.html';
                }
                // Focus username field
                if (usernameRef.current) {
                    usernameRef.current.focus();
                }
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setIsLoading(true);

                // Simulate network delay for UX
                await new Promise(r => setTimeout(r, 800));

                if (username === ADMIN_USER && password === ADMIN_PASS) {
                    setIsSuccess(true);
                    sessionStorage.setItem('admin_auth', 'authenticated');
                    setTimeout(() => {
                        window.location.href = '/admin-dashboard.html';
                    }, 1200);
                } else {
                    setIsLoading(false);
                    setError('اسم المستخدم أو كلمة المرور غير صحيحة');
                    setShakeForm(true);
                    setTimeout(() => setShakeForm(false), 600);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    handleSubmit(e);
                }
            };

            // Success state
            if (isSuccess) {
                return React.createElement('div', { className: 'min-h-screen bg-gradient-animate flex items-center justify-center relative' },
                    React.createElement('div', { className: 'orb orb-1' }),
                    React.createElement('div', { className: 'orb orb-2' }),
                    React.createElement('div', { className: 'text-center animate-fade-in-up' },
                        React.createElement('div', { className: 'success-icon inline-flex items-center justify-center w-20 h-20 rounded-full bg-green-500/10 border border-green-500/20 mb-6' },
                            React.createElement(CheckIcon)
                        ),
                        React.createElement('h2', { className: 'text-2xl font-bold text-white mb-2' }, 'تم تسجيل الدخول بنجاح'),
                        React.createElement('p', { className: 'text-white/50' }, 'جاري التحويل إلى لوحة التحكم...')
                    )
                );
            }

            return React.createElement('div', { className: 'min-h-screen bg-gradient-animate flex items-center justify-center relative p-4' },
                // Floating orbs
                React.createElement('div', { className: 'orb orb-1' }),
                React.createElement('div', { className: 'orb orb-2' }),
                React.createElement('div', { className: 'orb orb-3' }),

                // Geometric pattern overlay
                React.createElement('div', { className: 'absolute inset-0 geo-pattern pointer-events-none' }),

                // Main card
                React.createElement('div', { className: `glass-card rounded-3xl p-8 md:p-10 w-full max-w-md relative z-10 ${shakeForm ? 'shake' : ''}` },
                    // Logo section
                    React.createElement('div', { className: 'text-center mb-8 animate-fade-in-up animate-delay-1' },
                        React.createElement('div', { className: 'logo-ring inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-[#C5A059] to-[#a8863e] mb-5 border-2 border-[#C5A059]/30' },
                            React.createElement(ShieldIcon)
                        ),
                        React.createElement('h1', { className: 'text-2xl font-bold text-white mb-2' }, 'لوحة التحكم'),
                        React.createElement('p', { className: 'text-white/40 text-sm' }, 'مساعد الفقيه — العتبة الحسينية المقدسة')
                    ),

                    // Form
                    React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-5' },
                        // Username field
                        React.createElement('div', { className: 'animate-fade-in-up animate-delay-2' },
                            React.createElement('label', { className: 'block text-white/60 text-sm mb-2 font-medium' }, 'اسم المستخدم'),
                            React.createElement('div', { className: 'relative' },
                                React.createElement('div', { className: 'absolute right-4 top-1/2 -translate-y-1/2 text-white/30' },
                                    React.createElement(UserIcon)
                                ),
                                React.createElement('input', {
                                    ref: usernameRef,
                                    type: 'text',
                                    value: username,
                                    onChange: (e) => { setUsername(e.target.value); setError(''); },
                                    onKeyDown: handleKeyDown,
                                    placeholder: 'أدخل اسم المستخدم',
                                    className: 'input-field w-full pr-12 pl-4 py-3.5 rounded-xl text-white text-sm',
                                    autoComplete: 'username',
                                    id: 'admin-username'
                                })
                            )
                        ),

                        // Password field
                        React.createElement('div', { className: 'animate-fade-in-up animate-delay-3' },
                            React.createElement('label', { className: 'block text-white/60 text-sm mb-2 font-medium' }, 'كلمة المرور'),
                            React.createElement('div', { className: 'relative' },
                                React.createElement('div', { className: 'absolute right-4 top-1/2 -translate-y-1/2 text-white/30' },
                                    React.createElement(KeyIcon)
                                ),
                                React.createElement('input', {
                                    type: showPassword ? 'text' : 'password',
                                    value: password,
                                    onChange: (e) => { setPassword(e.target.value); setError(''); },
                                    onKeyDown: handleKeyDown,
                                    placeholder: 'أدخل كلمة المرور',
                                    className: 'input-field w-full pr-12 pl-12 py-3.5 rounded-xl text-white text-sm',
                                    autoComplete: 'current-password',
                                    id: 'admin-password'
                                }),
                                React.createElement('button', {
                                    type: 'button',
                                    onClick: () => setShowPassword(!showPassword),
                                    className: 'password-toggle absolute left-4 top-1/2 -translate-y-1/2 text-white/30'
                                }, showPassword ? React.createElement(EyeOffIcon) : React.createElement(EyeIcon))
                            )
                        ),

                        // Error message
                        error && React.createElement('div', { className: 'flex items-center gap-2 text-red-400 text-sm bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3 animate-fade-in-up' },
                            React.createElement(AlertIcon),
                            React.createElement('span', null, error)
                        ),

                        // Submit button
                        React.createElement('div', { className: 'animate-fade-in-up animate-delay-4 pt-2' },
                            React.createElement('button', {
                                type: 'submit',
                                disabled: isLoading || !username.trim() || !password.trim(),
                                className: 'btn-login w-full py-3.5 rounded-xl text-[#0a0e1a] font-bold text-base flex items-center justify-center gap-2',
                                id: 'admin-login-btn'
                            },
                                isLoading
                                    ? React.createElement('div', { className: 'spinner' })
                                    : React.createElement(React.Fragment, null,
                                        React.createElement(LockIcon),
                                        ' تسجيل الدخول'
                                    )
                            )
                        )
                    ),

                    // Footer
                    React.createElement('div', { className: 'text-center mt-8 animate-fade-in-up animate-delay-5' },
                        React.createElement('p', { className: 'text-white/20 text-xs leading-relaxed' },
                            'وحدة تنمية المقتنيات — شعبة نظم المعلومات',
                            React.createElement('br'),
                            'قسم الشؤون الفكرية والثقافية — العتبة الحسينية المقدسة'
                        )
                    )
                )
            );
        };

        const root = createRoot(document.getElementById('admin-root'));
        root.render(React.createElement(AdminLogin));
    </script>
</body>

</html>
